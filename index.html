<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ngakan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400..600&display=swap"
    rel="stylesheet">

  <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app" id="app">
    <div class="apocalypse-overlay"></div>
    <canvas id="bg" aria-label="Boids ecosystem simulation"></canvas>

    <div class="hud" id="hud">
      <!-- Census -->
      <section class="census glass" id="census" aria-label="Census">
        <button class="census-head" id="census-toggle" aria-expanded="false" aria-controls="census-body">
          <span>
            <span class="label">Census</span>
            <span class="census-total" id="total" style="display:block;margin-top:6px">0</span>
          </span>
          <span class="census-cap" id="cap-readout">cap 300</span>
        </button>
        <div class="census-body" id="census-body">
          <div class="mix" role="img" aria-label="Trait mix">
            <span class="m-inter" id="mix-inter" style="width:50%"></span>
            <span class="m-indiv" id="mix-indiv" style="width:50%"></span>
          </div>

          <div class="trait" data-trait="inter">
            <span class="dot" style="background:var(--interdependent)"></span>
            <span class="trait-name">Interdependent</span>
            <span class="trait-count" id="count-inter">0</span>
            <div class="stages" aria-hidden="true">
              <i id="st-inter-0" style="background:var(--interdependent)"></i>
              <i id="st-inter-1" style="background:var(--interdependent)"></i>
              <i id="st-inter-2" style="background:var(--interdependent)"></i>
            </div>
            <div class="stages-legend" id="lg-inter">neonate 0 · juvenile 0 · mature 0</div>
          </div>

          <div class="trait" data-trait="indiv">
            <span class="dot" style="background:var(--individual)"></span>
            <span class="trait-name">Individual</span>
            <span class="trait-count" id="count-indiv">0</span>
            <div class="stages" aria-hidden="true">
              <i id="st-indiv-0" style="background:var(--individual)"></i>
              <i id="st-indiv-1" style="background:var(--individual)"></i>
              <i id="st-indiv-2" style="background:var(--individual)"></i>
            </div>
            <div class="stages-legend" id="lg-indiv">neonate 0 · juvenile 0 · mature 0</div>
          </div>

          <svg class="spark" id="spark" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true">
            <line class="cap" id="spark-cap" x1="0" x2="240" y1="4" y2="4" />
            <path class="area" id="spark-area" d="" />
            <path class="line" id="spark-line" d="" />
          </svg>
        </div>
      </section>

      <button class="fold glass" id="fold" aria-label="Hide interface (H)" title="Hide interface (H)">
        <svg viewBox="0 0 24 24">
          <path d="M5 15l7-7 7 7" />
        </svg>
      </button>

      <!-- Dock -->
      <div class="dock glass" id="dock" role="toolbar" aria-label="Simulation controls">
        <div class="brand"><span class="pulse"></span>Ngakan</div>
        <span class="sep"></span>

        <button class="btn" id="btn-pause" aria-pressed="false" aria-label="Pause (Space)" title="Pause (Space)">
          <svg class="i-pause" viewBox="0 0 24 24">
            <path d="M8 5v14M16 5v14" />
          </svg>
          <svg class="i-play" viewBox="0 0 24 24">
            <path d="M7 5l12 7-12 7z" />
          </svg>
        </button>
        <button class="btn" id="btn-reset" aria-label="Reset ecosystem" title="Reset ecosystem">
          <svg viewBox="0 0 24 24">
            <path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" />
          </svg>
        </button>
        <button class="btn speed" id="btn-speed" aria-label="Simulation speed" title="Simulation speed">1×</button>

        <span class="sep"></span>

        <label class="cap-control">
          <span class="label">Cap</span>
          <input type="range" id="slider-max-pop" min="100" max="1000" step="10" value="300"
            aria-label="Population cap">
          <output id="val-max-pop" for="slider-max-pop">300</output>
        </label>

        <span class="sep"></span>

        <button class="switch" id="switch-apoc" role="switch" aria-checked="false"
          aria-label="Apocalyptic mode (A)" title="Apocalyptic mode (A)">
          <span class="knob"></span>Apocalyptic
        </button>

        <a class="portfolio" href="https://page.ngakan.com">
          <span>not a product yet</span>
          <svg viewBox="0 0 24 24">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>
      </div>

      <!-- Collapsed pill -->
      <button class="pill glass" id="pill" aria-label="Show interface (H)">
        <span class="pulse"></span>Ngakan <output id="pill-total">0</output>
      </button>
    </div>
  </div>

  <script src="savana.js"></script>
  <script src="hud.js"></script>
</body>

</html>
